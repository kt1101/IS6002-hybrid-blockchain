<script>
'use strict';
(function () {
  const DATA = JSON.parse(document.getElementById('data').textContent);
  const SVGNS = document.getElementById('defs').namespaceURI;
  const SERVED = /^https?:$/.test(location.protocol);

  // Fixed identity per backend: colour (CSS var --<id>) and marker shape.
  const BACKENDS = [
    { id: 'kafka', name: 'Kafka', shape: 'circle' },
    { id: 'raft', name: 'Raft', shape: 'square' },
    { id: 'tendermint', name: 'Tendermint', shape: 'triangle' },
    { id: 'bft2', name: 'HotStuff (bft2)', shape: 'diamond' },
  ];
  const BY_ID = {};
  BACKENDS.forEach((b) => { BY_ID[b.id] = b; });
  const ALL = BACKENDS.map((b) => b.id);
  const enabled = {};
  ALL.forEach((id) => { enabled[id] = true; });

  // Datasets (one per machine / campaign); the selected one feeds every tab.
  const DATASETS = DATA.datasets || [];
  let DS = DATASETS[0];
  try {
    const saved = window.localStorage.getItem('veritas-dashboard-dataset');
    if (saved && DATASETS.some((d) => d.id === saved)) DS = DATASETS.find((d) => d.id === saved);
  } catch (e) { /* storage may be unavailable (file://, private mode): keep the default */ }

  const METRIC = {
    tps: { label: 'throughput (tx/s)', unit: 'tx/s' },
    lat_mean_ms: { label: 'mean latency, all ops (ms)', unit: 'ms' },
    lat_p99_ms: { label: 'p99 latency, all ops (ms)', unit: 'ms' },
    w_lat_mean_ms: { label: 'write latency, mean (ms)', unit: 'ms' },
    w_lat_p99_ms: { label: 'write latency, p99 (ms)', unit: 'ms' },
    net_bytes_per_block: { label: 'network bytes per block (KB)', unit: 'KB', scale: 1e-3 },
  };
  // 'LAT' / 'LAT99' pick write latency when the dataset has per-run sidecars, else the CSV latency over all ops.
  function resolve(m) {
    if (m === 'LAT') return DS.write_latency ? 'w_lat_mean_ms' : 'lat_mean_ms';
    if (m === 'LAT99') return DS.write_latency ? 'w_lat_p99_ms' : 'lat_p99_ms';
    return m;
  }
  function latName(p99) { return DS.write_latency ? (p99 ? 'Write latency p99' : 'Write latency') : (p99 ? 'p99 latency (all ops)' : 'Mean latency (all ops)'); }
  function titleOf(spec) { return spec.title.replace('{LAT}', latName(false)).replace('{LAT99}', latName(true)); }
  function stat(r, m) {
    const st = r[m];
    if (!st) return null;
    const k = METRIC[m].scale || 1;
    return { mean: st.mean * k, std: st.std === null ? null : st.std * k };
  }
  function flags(r) {
    const f = [];
    if (r.saturated) f.push('host CPU saturated');
    if (r.mem) f.push('MEM ' + r.mem);
    return f.length ? ' · ' + f.join(' · ') : '';
  }
  const X_LABEL = {
    clients: (v) => v + ' clients', n: (v) => 'N = ' + v, block_size: (v) => 'block ' + v,
    rtt_ms: (v) => 'RTT ' + v + ' ms', workload: (v) => 'YCSB ' + String(v).toUpperCase(),
  };
  const X_TITLE = { clients: 'clients (log2 scale)', n: 'cluster size N', block_size: 'block size (tx, log10 scale)', rtt_ms: 'added RTT (ms)', workload: 'YCSB workload' };
  const FAULT_TEXT = {
    F1: 'crash', F2: 'silent (no votes)', F3: 'slow (200 ms delay)', F4: 'wrong state', 'F5-F2': 'f+1 silent (BFT only)', 'F5-F4': 'f+1 wrong state (BFT only)',
  };
  function latNote() {
    return DS.write_latency
      ? 'Latency here is the write latency (successful Sets) from the per-run ops sidecars, as in the figures of results/figs; reads are served locally and are not included.'
      : 'Latency here is lat_mean_ms / lat_p99_ms from the experiment CSVs: over all operations (reads and writes). ' +
        'The write-latency figures in results/figs use per-run sidecar files that are not included in the repository for this dataset, so the numbers differ.';
  }

  // ---------- small helpers ----------
  function h(tag, props, kids) {
    const e = document.createElement(tag);
    if (props) {
      Object.keys(props).forEach((k) => {
        if (k === 'text') e.textContent = props[k];
        else if (k === 'class') e.className = props[k];
        else e.setAttribute(k, props[k]);
      });
    }
    (kids || []).forEach((c) => { if (c) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return e;
  }
  function s(tag, attrs, parent) {
    const e = document.createElementNS(SVGNS, tag);
    Object.keys(attrs || {}).forEach((k) => {
      if (k === 'text') e.textContent = attrs[k];
      else e.setAttribute(k, attrs[k]);
    });
    if (parent) parent.appendChild(e);
    return e;
  }
  function fmt(v) {
    if (v === null || v === undefined || Number.isNaN(v)) return '–';
    if (v === 0) return '0';
    const a = Math.abs(v);
    const dp = a >= 100 ? 0 : a >= 10 ? 1 : 2;
    return v.toLocaleString('en-US', { minimumFractionDigits: dp, maximumFractionDigits: dp });
  }
  function fmtStat(st, unit) {
    const u = unit ? ' ' + unit : '';
    return st.std === null ? fmt(st.mean) + u : fmt(st.mean) + ' ± ' + fmt(st.std) + u;
  }
  function repsText(n) { return '(' + n + (n === 1 ? ' rep)' : ' reps)'); }
  function ratio(a, b) { return (a / b).toFixed(2) + '×'; }
  function pct(a, b) {
    const p = (a / b - 1) * 100;
    return (p >= 0 ? '+' : '−') + Math.abs(p).toFixed(0) + '%';
  }
  function mean(xs) { return xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : null; }
  function uniq(xs) { return Array.from(new Set(xs)); }
  function rowsOf(exp, ds) { return ((ds || DS).experiments || {})[exp] || []; }
  function find(exp, where) {
    return rowsOf(exp).find((r) => Object.keys(where).every((k) => r[k] === where[k]));
  }

  // Marker glyph centred on (cx, cy); r ~ visual radius.
  function glyph(shape, cx, cy, r, parent, cls) {
    let e;
    if (shape === 'circle') e = s('circle', { cx: cx, cy: cy, r: r }, parent);
    else if (shape === 'square') { const a = r * 0.9; e = s('rect', { x: cx - a, y: cy - a, width: 2 * a, height: 2 * a, rx: 1 }, parent); }
    else if (shape === 'triangle') { const a = r * 1.25; e = s('path', { d: 'M' + cx + ',' + (cy - a) + 'L' + (cx + a) + ',' + (cy + a * 0.8) + 'L' + (cx - a) + ',' + (cy + a * 0.8) + 'Z' }, parent); }
    else { const a = r * 1.3; e = s('path', { d: 'M' + cx + ',' + (cy - a) + 'L' + (cx + a) + ',' + cy + 'L' + cx + ',' + (cy + a) + 'L' + (cx - a) + ',' + cy + 'Z' }, parent); }
    if (cls) e.setAttribute('class', cls);
    return e;
  }
  // Inline key for legends/tables: a short line (lines) or a swatch (bars) plus the marker shape.
  function key(id, kind) {
    const b = BY_ID[id];
    const svg = s('svg', { width: kind === 'line' ? 26 : 14, height: 14, 'aria-hidden': 'true', class: 's-' + id });
    if (kind === 'line') s('path', { d: 'M1,7H25', class: 'line', style: 'fill:none;stroke:var(--c);stroke-width:2' }, svg);
    glyph(b.shape, kind === 'line' ? 13 : 7, 7, 4.5, svg, 'mark');
    return svg;
  }
  function legend(ids, kind) {
    return h('ul', { class: 'legend', 'aria-label': 'Legend' }, ids.map((id) => h('li', null, [key(id, kind), BY_ID[id].name])));
  }

  // ---------- scales ----------
  function niceStep(span, count) {
    const raw = span / count;
    const p = Math.pow(10, Math.floor(Math.log10(raw)));
    const m = raw / p;
    return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10) * p;
  }
  function linearY(maxV, y0, y1) {
    const step = niceStep(maxV > 0 ? maxV : 1, 4);
    const top = Math.max(step, Math.ceil((maxV > 0 ? maxV : 1) / step) * step);
    const ticks = [];
    for (let t = 0; t <= top + step / 2; t += step) ticks.push(t);
    return { f: (v) => y1 - (v / top) * (y1 - y0), ticks: ticks };
  }
  function logY(minV, maxV, y0, y1) {
    const cands = [];
    for (let k = -2; k <= 7; k++) [1, 2, 5].forEach((m) => cands.push(m * Math.pow(10, k)));
    const lo = cands.filter((c) => c <= minV).pop() || cands[0];
    const hi = cands.find((c) => c >= maxV) || cands[cands.length - 1];
    const L0 = Math.log10(lo), L1 = Math.log10(hi);
    return { f: (v) => y1 - ((Math.log10(Math.max(v, lo)) - L0) / (L1 - L0 || 1)) * (y1 - y0), ticks: cands.filter((c) => c >= lo && c <= hi) };
  }
  function tickText(v) { return v >= 10000 ? (v / 1000).toLocaleString('en-US') + 'K' : v.toLocaleString('en-US'); }

  // ---------- tooltip ----------
  const tip = document.getElementById('tip');
  function showTip(head, rows, x, y) {
    tip.replaceChildren(h('div', { class: 'head', text: head }));
    rows.forEach((r) => tip.appendChild(h('div', { class: 'row' }, [key(r.id, r.kind), h('span', { class: 'val', text: r.val }), h('span', { class: 'name', text: r.name })])));
    tip.hidden = false;
    const w = tip.offsetWidth, ht = tip.offsetHeight;
    let left = x + 14, top = y + 14;
    if (left + w > window.innerWidth - 8) left = Math.max(8, x - w - 14);
    if (top + ht > window.innerHeight - 8) top = Math.max(8, y - ht - 14);
    tip.style.left = left + 'px';
    tip.style.top = top + 'px';
  }
  function hideTip() { tip.hidden = true; }
  function tipRow(r, metric, kind) {
    return { id: r.backend, kind: kind, val: fmtStat(stat(r, metric), METRIC[metric].unit) + ' ' + repsText(r.reps), name: BY_ID[r.backend].name + flags(r) };
  }

  // ---------- data table under each chart ----------
  function dataTable(rows, xKey, xLabel, metric) {
    const t = h('table');
    t.appendChild(h('thead', null, [h('tr', null, [
      h('th', { text: xLabel }), h('th', { text: 'backend' }),
      h('th', { class: 'num', text: METRIC[metric].label.replace(/ \((tx\/s|ms|KB)\)$/, '') + ' mean' }),
      h('th', { class: 'num', text: 'std' }), h('th', { class: 'num', text: 'reps' }), h('th', { text: 'flags' })])]));
    const tb = h('tbody');
    rows.forEach((r) => {
      const st = stat(r, metric);
      tb.appendChild(h('tr', null, [
        h('td', { text: xKey(r) }), h('td', null, [h('span', { class: 'key' }, [key(r.backend, 'bar'), BY_ID[r.backend].name])]),
        h('td', { class: 'num', text: fmt(st.mean) }), h('td', { class: 'num', text: fmt(st.std) }),
        h('td', { class: 'num', text: String(r.reps) }), h('td', { text: flags(r).replace(/^ · /, '') })]));
    });
    t.appendChild(tb);
    return h('details', null, [h('summary', { text: 'Data table' }), h('div', { class: 'table-wrap' }, [t])]);
  }

  // ---------- line chart ----------
  function lineChart(box, spec, ids) {
    const W = Math.max(300, box.clientWidth), H = 270;
    const m = { l: 56, r: 18, t: 30, b: 44 };
    const rows = rowsOf(spec.exp).filter((r) => ids.includes(r.backend) && stat(r, spec.metric));
    const xs = uniq(rows.map((r) => r[spec.x])).sort((a, b) => a - b);
    const svg = s('svg', { width: W, height: H, viewBox: '0 0 ' + W + ' ' + H, role: 'group', 'aria-label': titleOf(spec) });
    if (!rows.length) { box.replaceChildren(h('p', { class: 'empty', text: 'No backend selected.' })); return; }
    const tx = spec.xScale === 'log2' ? Math.log2 : spec.xScale === 'log10' ? Math.log10 : (v) => v;
    const tmin = tx(xs[0]), tmax = tx(xs[xs.length - 1]);
    const pad = 18;
    const X = (v) => (tmax === tmin ? (m.l + W - m.r) / 2 : m.l + pad + ((tx(v) - tmin) / (tmax - tmin)) * (W - m.r - m.l - 2 * pad));
    const vals = rows.map((r) => stat(r, spec.metric).mean);
    const y = spec.yScale === 'log' ? logY(Math.min.apply(null, vals), Math.max.apply(null, vals), m.t, H - m.b)
      : linearY(Math.max.apply(null, rows.map((r) => { const st = stat(r, spec.metric); return st.mean + (st.std || 0); })), m.t, H - m.b);
    const ax = s('g', { class: 'axis' }, svg);
    y.ticks.forEach((t) => {
      s('line', { x1: m.l, x2: W - m.r, y1: y.f(t), y2: y.f(t), class: 'grid-line' }, ax);
      s('text', { x: m.l - 8, y: y.f(t) + 4, 'text-anchor': 'end', class: 'tick', text: tickText(t) }, ax);
    });
    s('line', { x1: m.l, x2: W - m.r, y1: H - m.b, y2: H - m.b }, ax);
    xs.forEach((v) => s('text', { x: X(v), y: H - m.b + 18, 'text-anchor': 'middle', class: 'tick', text: String(v) }, ax));
    s('text', { x: (m.l + W - m.r) / 2, y: H - 6, 'text-anchor': 'middle', class: 'axis-title', text: X_TITLE[spec.x] }, ax);
    s('text', { x: m.l - 48, y: 12, class: 'axis-title', text: METRIC[spec.metric].label + (spec.yScale === 'log' ? ', log scale' : '') }, ax);

    const cross = s('line', { y1: m.t, y2: H - m.b, class: 'crosshair', visibility: 'hidden' }, svg);
    const pts = []; // {x, el, row}
    ids.forEach((id) => {
      const sr = rows.filter((r) => r.backend === id).sort((a, b) => a[spec.x] - b[spec.x]);
      if (!sr.length) return;
      const g = s('g', { class: 'series s-' + id }, svg);
      s('path', { class: 'line', d: sr.map((r, i) => (i ? 'L' : 'M') + X(r[spec.x]).toFixed(1) + ',' + y.f(stat(r, spec.metric).mean).toFixed(1)).join('') }, g);
      sr.forEach((r) => {
        const cx = X(r[spec.x]), cy = y.f(stat(r, spec.metric).mean);
        const pg = s('g', { class: 'pt', tabindex: '0', role: 'img',
          'aria-label': BY_ID[id].name + ', ' + X_LABEL[spec.x](r[spec.x]) + ': ' + fmtStat(stat(r, spec.metric), METRIC[spec.metric].unit) + ' ' + repsText(r.reps) + flags(r) }, g);
        glyph(BY_ID[id].shape, cx, cy, 5, pg, r.saturated ? 'mark sat' : 'mark');
        pts.push({ x: r[spec.x], el: pg, row: r, cx: cx, cy: cy });
      });
    });
    function at(xv, clientX, clientY) {
      cross.setAttribute('x1', X(xv)); cross.setAttribute('x2', X(xv)); cross.setAttribute('visibility', 'visible');
      const here = pts.filter((p) => p.x === xv);
      pts.forEach((p) => p.el.classList.toggle('hot', p.x === xv));
      const sorted = here.map((p) => p.row).sort((a, b) => stat(b, spec.metric).mean - stat(a, spec.metric).mean);
      showTip(X_LABEL[spec.x](xv), sorted.map((r) => tipRow(r, spec.metric, 'line')), clientX, clientY);
    }
    function off() { cross.setAttribute('visibility', 'hidden'); pts.forEach((p) => p.el.classList.remove('hot')); hideTip(); }
    const hit = s('rect', { x: m.l, y: m.t, width: W - m.l - m.r, height: H - m.t - m.b, class: 'hit' }, svg);
    svg.insertBefore(hit, cross);
    svg.addEventListener('pointermove', (ev) => {
      const rect = svg.getBoundingClientRect();
      const px = (ev.clientX - rect.left) * (W / rect.width);
      let best = xs[0];
      xs.forEach((v) => { if (Math.abs(X(v) - px) < Math.abs(X(best) - px)) best = v; });
      at(best, ev.clientX, ev.clientY);
    });
    svg.addEventListener('pointerleave', off);
    pts.forEach((p) => {
      p.el.addEventListener('focus', () => { const r = p.el.getBoundingClientRect(); at(p.x, r.right, r.bottom); });
      p.el.addEventListener('blur', off);
    });
    box.replaceChildren(svg);
  }

  // ---------- grouped bar chart ----------
  // groups: [{label, sub, rows}] ; every group's rows hold at most one row per backend.
  function barChart(box, spec, ids, groups) {
    const W = Math.max(300, box.clientWidth), H = 290;
    const m = { l: 56, r: 12, t: 30, b: spec.twoLineX ? 52 : 44 };
    groups = groups.map((g) => Object.assign({}, g, { rows: g.rows.filter((r) => stat(r, spec.metric)) })).filter((g) => g.rows.length);
    const present = ids.filter((id) => groups.some((g) => g.rows.some((r) => r.backend === id)));
    if (!present.length) { box.replaceChildren(h('p', { class: 'empty', text: 'No backend selected.' })); return; }
    const svg = s('svg', { width: W, height: H, viewBox: '0 0 ' + W + ' ' + H, role: 'group', 'aria-label': titleOf(spec) });
    const all = [];
    groups.forEach((g) => g.rows.forEach((r) => { if (present.includes(r.backend)) all.push(r); }));
    const y = linearY(Math.max.apply(null, all.map((r) => { const st = stat(r, spec.metric); return st.mean + (st.std || 0); })), m.t, H - m.b);
    const ax = s('g', { class: 'axis' }, svg);
    y.ticks.forEach((t) => {
      s('line', { x1: m.l, x2: W - m.r, y1: y.f(t), y2: y.f(t), class: 'grid-line' }, ax);
      s('text', { x: m.l - 8, y: y.f(t) + 4, 'text-anchor': 'end', class: 'tick', text: tickText(t) }, ax);
    });
    s('text', { x: m.l - 48, y: 12, class: 'axis-title', text: METRIC[spec.metric].label }, ax);
    const band = (W - m.l - m.r) / groups.length;
    const gap = 2;
    const bw = Math.max(4, Math.min(24, (band * 0.8 - gap * (present.length - 1)) / present.length));
    const span = present.length * bw + (present.length - 1) * gap;
    const base = H - m.b;
    groups.forEach((g, gi) => {
      const cx = m.l + band * gi + band / 2;
      s('text', { x: cx, y: base + 18, 'text-anchor': 'middle', class: 'tick', text: g.label }, ax);
      if (g.sub) s('text', { x: cx, y: base + 32, 'text-anchor': 'middle', class: 'tick', text: g.sub.replace(/node/g, 'n') }, ax);
      present.forEach((id, bi) => {
        const r = g.rows.find((q) => q.backend === id);
        if (!r) return;
        const st = stat(r, spec.metric);
        const x0 = cx - span / 2 + bi * (bw + gap);
        const top = Math.min(y.f(st.mean), base - 1.5);
        const rad = Math.min(4, bw / 2, base - top);
        const bg = s('g', { class: 'bar-g s-' + id, tabindex: '0', role: 'img',
          'aria-label': BY_ID[id].name + ', ' + g.label + (g.sub ? ' ' + g.sub : '') + ': ' + fmtStat(st, METRIC[spec.metric].unit) + ' ' + repsText(r.reps) + flags(r) }, svg);
        s('rect', { x: x0 - gap / 2, y: m.t, width: bw + gap, height: base - m.t, class: 'hit' }, bg);
        s('path', { class: r.saturated || r.mem ? 'bar sat' : 'bar', d: 'M' + x0 + ',' + base + 'V' + (top + rad) + 'Q' + x0 + ',' + top + ' ' + (x0 + rad) + ',' + top +
          'H' + (x0 + bw - rad) + 'Q' + (x0 + bw) + ',' + top + ' ' + (x0 + bw) + ',' + (top + rad) + 'V' + base + 'Z' }, bg);
        let capY = top;
        if (st.std !== null && st.std > 0) {
          const y1 = y.f(st.mean + st.std), y2 = Math.min(base, y.f(Math.max(0, st.mean - st.std)));
          const mx = x0 + bw / 2;
          s('path', { class: 'whisker', d: 'M' + mx + ',' + y1 + 'V' + y2 + 'M' + (mx - 3) + ',' + y1 + 'H' + (mx + 3) + 'M' + (mx - 3) + ',' + y2 + 'H' + (mx + 3) }, bg);
          capY = Math.min(capY, y1);
        }
        glyph(BY_ID[id].shape, x0 + bw / 2, capY - 8, 3.5, bg, 'mark');
        const show = (cxp, cyp) => showTip(g.label + (g.sub ? ' ' + g.sub : '') + (g.title ? ' · ' + g.title : ''), [tipRow(r, spec.metric, 'bar')], cxp, cyp);
        bg.addEventListener('pointermove', (ev) => show(ev.clientX, ev.clientY));
        bg.addEventListener('pointerleave', hideTip);
        bg.addEventListener('focus', () => { const b = bg.getBoundingClientRect(); show(b.right, b.top); });
        bg.addEventListener('blur', hideTip);
      });
    });
    s('line', { x1: m.l, x2: W - m.r, y1: base, y2: base, class: 'axis-base', stroke: 'var(--line-strong)' }, svg);
    box.replaceChildren(svg);
  }

  // ---------- chart cards ----------
  function fixedParams(exp, skip) {
    const rows = rowsOf(exp);
    const parts = [];
    const label = { n: (v) => 'N=' + v, clients: (v) => v + ' clients', block_size: (v) => 'block ' + v, workload: (v) => 'YCSB ' + String(v).toUpperCase(), rtt_ms: (v) => 'RTT ' + v + ' ms' };
    Object.keys(label).forEach((k) => {
      if (skip.includes(k)) return;
      const vs = uniq(rows.map((r) => r[k]));
      if (vs.length === 1) parts.push(label[k](vs[0]));
    });
    return parts.join(' · ');
  }
  function missingText(exp) {
    if (DS.missing && DS.missing[exp]) return DS.missing[exp];
    return rowsOf(exp).length ? '' : 'Not measured in this dataset.';
  }
  function emptyCard(title, text) {
    return { el: h('section', { class: 'card' }, [h('h3', { text: title }), h('p', { class: 'empty', text: text })]), render: () => {} };
  }
  function noMetric(metric) { return h('p', { class: 'empty', text: 'No ' + METRIC[metric].label.replace(/ \([^)]*\)$/, '') + ' in this dataset.' }); }
  function lineCard(spec0, tab) {
    const spec = Object.assign({}, spec0, { metric: resolve(spec0.metric) });
    const title = titleOf(spec);
    const miss = missingText(spec.exp);
    if (miss) return emptyCard(title, miss);
    const box = h('div', { class: 'chart' });
    const card = h('section', { class: 'card' }, [
      h('h3', { text: title }),
      h('p', { class: 'sub', text: spec.expLabel + ' · ' + fixedParams(spec.exp, [spec.x]) }),
    ]);
    const leg = h('div');
    const tbl = h('div');
    card.append(leg, box, tbl);
    if (spec.note) card.appendChild(h('p', { class: 'note', text: spec.note }));
    return { el: card, render: () => {
      const ids = tab.backends.filter((id) => enabled[id]);
      const have = rowsOf(spec.exp).filter((r) => stat(r, spec.metric));
      if (!have.length) { leg.replaceChildren(); tbl.replaceChildren(); box.replaceChildren(noMetric(spec.metric)); return; }
      const present = ids.filter((id) => have.some((r) => r.backend === id));
      leg.replaceChildren(present.length > 1 ? legend(present, 'line') : '');
      lineChart(box, spec, ids);
      const rows = have.filter((r) => ids.includes(r.backend))
        .sort((a, b) => a[spec.x] - b[spec.x] || ALL.indexOf(a.backend) - ALL.indexOf(b.backend));
      tbl.replaceChildren(rows.length ? dataTable(rows, (r) => String(r[spec.x]), spec.x, spec.metric) : '');
    } };
  }
  function barCard(spec0, tab) {
    const spec = Object.assign({}, spec0, { metric: resolve(spec0.metric) });
    const title = titleOf(spec);
    const miss = spec.exp ? missingText(spec.exp) : '';
    if (miss) return emptyCard(title, miss);
    const box = h('div', { class: 'chart' });
    const card = h('section', { class: 'card' }, [h('h3', { text: title }), h('p', { class: 'sub', text: spec.subtitle })]);
    const leg = h('div');
    const tbl = h('div');
    card.append(leg, box, tbl);
    if (spec.note) card.appendChild(h('p', { class: 'note', text: spec.note }));
    return { el: card, render: () => {
      const ids = tab.backends.filter((id) => enabled[id]);
      const groups = spec.groups();
      if (!groups.some((g) => g.rows.some((r) => stat(r, spec.metric)))) { leg.replaceChildren(); tbl.replaceChildren(); box.replaceChildren(noMetric(spec.metric)); return; }
      leg.replaceChildren(ids.length > 1 ? legend(ids.filter((id) => groups.some((g) => g.rows.some((r) => r.backend === id && stat(r, spec.metric)))), 'bar') : '');
      barChart(box, spec, ids, groups);
      const rows = [];
      groups.forEach((g) => ALL.forEach((id) => {
        const r = g.rows.find((q) => q.backend === id);
        if (r && ids.includes(id) && stat(r, spec.metric)) rows.push(Object.assign({ _x: g.label + (g.sub ? ' ' + g.sub : '') }, r));
      }));
      tbl.replaceChildren(rows.length ? dataTable(rows, (r) => r._x, spec.xName, spec.metric) : '');
    } };
  }

  // E4: one group per workload.
  function workloadGroups() {
    const rows = rowsOf('e4');
    return uniq(rows.map((r) => r.workload)).sort().map((w) => ({ label: X_LABEL.workload(w), rows: rows.filter((r) => r.workload === w) }));
  }
  // E6 at cluster size n: one group per fault scenario (node list shown only
  // where a backend ran several variants of a scenario, as in results/figs),
  // preceded by the no-fault reference (E6 "none" rows, else E2 at the same n).
  function faultScenario(f) { return String(f).split(':')[0]; }
  function faultNodes(f) { const p = String(f).split(':'); return p.length > 1 ? p[1].split('@')[0] : ''; }
  function faultLabels(rows) {
    // fault string -> {label, sub}: the node list is shown where some backend ran several variants.
    const faulted = rows.filter((r) => r.fault !== 'none');
    const split = new Set();
    uniq(faulted.map((r) => faultScenario(r.fault))).forEach((sc) => {
      ALL.forEach((id) => { if (uniq(faulted.filter((r) => r.backend === id && faultScenario(r.fault) === sc).map((r) => r.fault)).length > 1) split.add(sc); });
    });
    const out = {};
    faulted.forEach((r) => { const sc = faultScenario(r.fault); out[r.fault] = { label: sc, sub: split.has(sc) ? '(' + faultNodes(r.fault) + ')' : '' }; });
    return out;
  }
  function faultGroups(n) {
    const rows = rowsOf('e6').filter((r) => r.n === n);
    const faulted = rows.filter((r) => r.fault !== 'none');
    const labels = faultLabels(rows);
    const byLabel = new Map();
    faulted.forEach((r) => {
      const l = labels[r.fault];
      const k = l.label + ' ' + l.sub;
      if (!byLabel.has(k)) byLabel.set(k, { label: l.label, sub: l.sub, title: FAULT_TEXT[l.label] || '', rows: [] });
      byLabel.get(k).rows.push(r);
    });
    const groups = Array.from(byLabel.values()).sort((a, b) => (a.label + ' ' + a.sub).localeCompare(b.label + ' ' + b.sub));
    let ref = rows.filter((r) => r.fault === 'none');
    let refLabel = 'none';
    if (!ref.length) {
      const c = uniq(faulted.map((r) => r.clients))[0];
      ref = rowsOf('e2').filter((r) => r.n === n && r.clients === c && r.fault === 'none');
      refLabel = 'none (E2)';
    }
    if (ref.length) groups.unshift({ label: refLabel, sub: '', title: 'no fault, reference', rows: ref });
    return groups;
  }

  // Kafka operation counts (the paper's Figure 8 measurement) per cluster size.
  function kafkaOpsCard() {
    const rows = DS.kafka_ops || [];
    const title = 'Kafka operations vs cluster size';
    if (!rows.length) return emptyCard(title, 'Not recorded in this dataset.');
    const t = h('table');
    t.appendChild(h('thead', null, [h('tr', null, [h('th', { class: 'num', text: 'N' }), h('th', { class: 'num', text: 'clients' }),
      h('th', { class: 'num', text: 'writes (log-end offset)' }), h('th', { class: 'num', text: 'reads (sum of consumer offsets)' }),
      h('th', { class: 'num', text: 'reads ÷ writes' }), h('th', { class: 'num', text: 'reps' })])]));
    const tb = h('tbody');
    rows.forEach((r) => tb.appendChild(h('tr', null, [h('td', { class: 'num', text: String(r.n) }), h('td', { class: 'num', text: String(r.clients) }),
      h('td', { class: 'num', text: fmtStat(r.writes, '') }), h('td', { class: 'num', text: fmtStat(r.reads, '') }),
      h('td', { class: 'num', text: fmt(r.reads.mean / r.writes.mean) }), h('td', { class: 'num', text: String(r.reps) })])));
    t.appendChild(tb);
    const lo = rows[0], hi = rows[rows.length - 1];
    const facts = [];
    if (hi.n !== lo.n) {
      facts.push('From N=' + lo.n + ' to N=' + hi.n + ': writes ×' + fmt(hi.writes.mean / lo.writes.mean) + ', reads ×' + fmt(hi.reads.mean / lo.reads.mean) +
        ' ((' + hi.n + '/' + lo.n + ')² = ' + fmt(Math.pow(hi.n / lo.n, 2)) + ').');
    }
    facts.push('Every Veritas (Kafka) node consumes every message of the topic, so reads = N × writes; with approve-all every node also writes an approve for every block.');
    return { el: h('section', { class: 'card' }, [h('h3', { text: title }),
      h('p', { class: 'sub', text: 'E2 · Kafka backend · counters read from the broker after each run' }),
      h('div', { class: 'table-wrap' }, [t]), h('ul', { class: 'facts' }, facts.map((f) => h('li', { text: f })))]), render: () => {} };
  }

  // E6 write ratio: successful writes/s after the fault ÷ before (per-run write timelines).
  function hasWriteRatio() { return rowsOf('e6').some((r) => r.write_ratio); }
  function ratioCell(r) {
    if (!r || !r.write_ratio) return h('td', { class: 'ratio', text: '–' });
    const w = r.write_ratio;
    const txt = w.n > 1 && w.min !== w.max ? fmt(w.mean) + ' (' + fmt(w.min) + '–' + fmt(w.max) + ')' : fmt(w.mean);
    const td = h('td', { class: 'ratio s-' + r.backend + (w.mean < 0.05 ? ' zero' : ''), title: w.n + ' reps' + flags(r) });
    td.appendChild(h('span', { class: 'bar-in', style: 'width:' + Math.round(Math.min(1.2, w.mean) * 40) + 'px' }));
    td.appendChild(document.createTextNode(txt + (r.mem ? ' ·1g' : '')));
    return td;
  }
  function writeRatioTable(n, ids) {
    const rows = rowsOf('e6').filter((r) => r.n === n && r.fault !== 'none');
    const labels = faultLabels(rowsOf('e6').filter((r) => r.n === n));
    const cols = uniq(rows.map((r) => labels[r.fault].label + (labels[r.fault].sub ? ' ' + labels[r.fault].sub : ''))).sort();
    const t = h('table');
    t.appendChild(h('thead', null, [h('tr', null, [h('th', { text: 'backend' })].concat(cols.map((c) => h('th', { class: 'num', text: c }))))]));
    const tb = h('tbody');
    ids.forEach((id) => {
      if (!rows.some((r) => r.backend === id)) return;
      tb.appendChild(h('tr', null, [h('td', null, [h('span', { class: 'key' }, [key(id, 'bar'), BY_ID[id].name])])].concat(cols.map((c) => {
        const r = rows.find((q) => q.backend === id && labels[q.fault].label + (labels[q.fault].sub ? ' ' + labels[q.fault].sub : '') === c);
        return ratioCell(r);
      }))));
    });
    t.appendChild(tb);
    return t;
  }
  function writeRatioCard(tab) {
    const title = 'Write ratio after the fault';
    if (!hasWriteRatio()) return emptyCard(title, 'Needs the per-run write timelines, which are not in the repository for this dataset: see the recovery table below.');
    const wrap = h('div');
    const card = h('section', { class: 'card' }, [h('h3', { text: title }),
      h('p', { class: 'sub', text: 'Mean successful writes/s from 10 s after the fault to the end of the run, divided by the mean before the fault (min–max over reps). 1.0 = no loss; 0 = writes stopped.' }), wrap,
      h('p', { class: 'note', text: 'Columns: ' + Object.keys(FAULT_TEXT).filter((k) => k !== 'F3').map((k) => k + ' ' + FAULT_TEXT[k]).join(' · ') +
        '. "·1g" marks runs with MEM=1g. Throughput also decays in long runs without a consensus fault, so compare with F4 rather than with 1.0.' })]);
    return { el: card, render: () => {
      const ids = tab.backends.filter((id) => enabled[id]);
      const ns = uniq(rowsOf('e6').map((r) => r.n)).sort((a, b) => a - b);
      wrap.replaceChildren.apply(wrap, ns.map((n) => h('div', null, [h('p', { class: 'sub', text: 'N=' + n }), h('div', { class: 'table-wrap' }, [writeRatioTable(n, ids)])])));
    } };
  }
  function wrongGetsCard(tab) {
    const title = 'Wrong values returned to clients (F4, F5-F4)';
    const rows = rowsOf('e6').filter((r) => /^F(4|5-F4)/.test(faultScenario(r.fault)));
    if (!rows.length) return emptyCard(title, 'No wrong-state runs in this dataset.');

  function compare(a, b) {

    out.e1b = find('e1', { backend: b, clients: maxC });

    if (m3 && cl && rowsOf('e1-bf100ms', m3).length && rowsOf('e1', cl).length) {
      const t = h('table');
      t.appendChild(h('thead', null, [h('tr', null, [h('th', { text: 'backend' }), h('th', { class: 'num', text: 'clients' }), h('th', { class: 'num', text: 'M3 tx/s' }), h('th', { class: 'num', text: 'Cloud tx/s' }), h('th', { class: 'num', text: 'Cloud ÷ M3' })])]));
      const tb = h('tbody');
      BACKENDS.forEach((b) => rowsOf('e1', cl).filter((r) => r.backend === b.id).sort((x, y) => x.clients - y.clients).forEach((r) => {
        const o = rowsOf('e1-bf100ms', m3).find((q) => q.backend === b.id && q.clients === r.clients);
        tb.appendChild(h('tr', null, [h('td', null, [h('span', { class: 'key' }, [key(b.id, 'bar'), b.name])]), h('td', { class: 'num', text: String(r.clients) }),
          h('td', { class: 'num', text: o ? fmtStat(o.tps, '') : '–' }), h('td', { class: 'num', text: fmtStat(r.tps, '') }), h('td', { class: 'num', text: o ? ratio(r.tps.mean, o.tps.mean) : '–' })]));
      }));
      t.appendChild(tb);
      const cs = uniq(rowsOf('e1', cl).map((r) => r.clients)).sort((x, y) => x - y);
      const span = (c) => {
        const rs = rowsOf('e1', cl).filter((r) => r.clients === c).map((r) => { const o = rowsOf('e1-bf100ms', m3).find((q) => q.backend === r.backend && q.clients === c); return o ? r.tps.mean / o.tps.mean : null; }).filter((v) => v !== null);
        return rs.length ? fmt(Math.min.apply(null, rs)) + '–' + fmt(Math.max.apply(null, rs)) + '×' : '–';
      };
      const rank = (ds, exp, c) => rowsOf(exp, ds).filter((r) => r.clients === c).sort((x, y) => y.tps.mean - x.tps.mean).map((r) => BY_ID[r.backend].name).join(' > ');
      const cMax = cs[cs.length - 1];
      grid.appendChild(h('section', { class: 'card' }, [h('h3', { text: 'Same experiment on two machines (E1, flush 100 ms)' }),
        h('p', { class: 'sub', text: 'M3 E1 at 100 ms flush against Cloud E1: N=4, block 100, YCSB-A.' }), h('div', { class: 'table-wrap' }, [t]),
        h('ul', { class: 'facts' }, [
          h('li', { text: 'Cloud ÷ M3 at ' + cs[0] + ' clients: ' + span(cs[0]) + '; at ' + cMax + ' clients: ' + span(cMax) + '.' }),
          h('li', { text: 'Order at ' + cMax + ' clients — M3: ' + rank(m3, 'e1-bf100ms', cMax) + '; Cloud: ' + rank(cl, 'e1', cMax) + '. Check the ± spread before reading a ranking: M3 has CV 13–26 % there.' }),
        ])]));
    }
    panel.appendChild(grid);
    panel.appendChild(h('section', { class: 'card' }, [h('h3', { text: 'Known limitations' }), h('ul', { class: 'facts' }, LIMITS.map((x) => h('li', { text: x })))]));
    const pt = h('table', { class: 'scope' });
    pt.appendChild(h('tbody', null, PHASE2.items.map((r) => h('tr', null, [h('td', { text: r[0] }), h('td', { text: r[1] })]))));
    panel.appendChild(h('section', { class: 'card' }, [h('h3', null, ['Next: phase 2 ', h('span', { class: 'tag planned', text: 'planned, not measured' })]),
      h('p', { class: 'sub', text: PHASE2.intro }), h('div', { class: 'table-wrap' }, [pt])]));
    return { el: panel, charts: [] };
  }

  // ---------- tabs ----------
  const NB_NOTE = "Bytes sent by node1..N (plus the Kafka broker for Kafka) per Veritas block applied on node1, in the measured window of no-fault runs: consensus traffic, including Tendermint's empty heights and bft2's empty views, and replies to clients (~1 KB per Get).";
  function defineTabs() {
    const lat = 'LAT';
    const nb = 'net_bytes_per_block';
    return [
      { id: 'overview', label: 'Overview', backends: [] },
      { id: 'rq1', label: 'RQ1 HotStuff vs Tendermint', backends: ['tendermint', 'bft2'],
        intro: 'HotStuff (bft2, linear-complexity BFT) against Tendermint: throughput, latency and network bytes per block as the number of clients grows (E1) and as the cluster grows (E2).',
        charts: [
          { type: 'line', exp: 'e1', expLabel: 'E1', x: 'clients', metric: 'tps', xScale: 'log2', yScale: 'log', title: 'E1 · Throughput vs clients' },
          { type: 'line', exp: 'e1', expLabel: 'E1', x: 'clients', metric: lat, xScale: 'log2', title: 'E1 · {LAT} vs clients' },
          { type: 'line', exp: 'e2', expLabel: 'E2', x: 'n', metric: 'tps', title: 'E2 · Throughput vs cluster size' },
          { type: 'line', exp: 'e2', expLabel: 'E2', x: 'n', metric: lat, title: 'E2 · {LAT} vs cluster size' },
          { type: 'line', exp: 'e2', expLabel: 'E2', x: 'n', metric: nb, title: 'E2 · Network bytes per block vs cluster size',
            note: NB_NOTE + ' Growth with N reflects the message pattern of each protocol.' },
          { type: 'line', exp: 'e1', expLabel: 'E1', x: 'clients', metric: nb, xScale: 'log2', title: 'E1 · Network bytes per block vs clients' },
        ] },
      { id: 'rq2', label: 'RQ2 Raft vs Kafka', backends: ['kafka', 'raft'],
        intro: 'Raft (leader-based CFT) against Kafka approve-all (pub-sub CFT): throughput and latency (E1, E2), network bytes per block, and the Kafka operation counts behind the O(N²) ACK argument.',
        charts: [
          { type: 'line', exp: 'e1', expLabel: 'E1', x: 'clients', metric: 'tps', xScale: 'log2', yScale: 'log', title: 'E1 · Throughput vs clients' },
          { type: 'line', exp: 'e1', expLabel: 'E1', x: 'clients', metric: lat, xScale: 'log2', title: 'E1 · {LAT} vs clients' },
          { type: 'line', exp: 'e2', expLabel: 'E2', x: 'n', metric: 'tps', title: 'E2 · Throughput vs cluster size' },
          { type: 'line', exp: 'e2', expLabel: 'E2', x: 'n', metric: nb, title: 'E2 · Network bytes per block vs cluster size',
            note: NB_NOTE },
          { type: 'kafkaops' },
          { type: 'line', exp: 'e1-bf100ms', expLabel: 'E1, batch flush 100 ms', x: 'clients', metric: 'tps', xScale: 'log2', yScale: 'log', title: 'E1 (100 ms flush) · Throughput vs clients' },
        ] },
      { id: 'sens', label: 'Sensitivity', backends: ALL,
        intro: 'How each backend reacts to block size (E3), workload mix (E4) and added network round-trip time (E5).',
        charts: [
          { type: 'line', exp: 'e3', expLabel: 'E3', x: 'block_size', metric: 'tps', xScale: 'log10', title: 'E3 · Throughput vs block size',
            note: 'Blocks of 100 and 1000 are never full in a closed loop of 256 clients (≈ 32 pending Sets per node), so those two points should match (NOTES I3).' },
          { type: 'line', exp: 'e3', expLabel: 'E3', x: 'block_size', metric: lat, xScale: 'log10', title: 'E3 · {LAT} vs block size' },
          { type: 'bar', exp: 'e4', metric: 'tps', title: 'E4 · Throughput by workload', subtitle: 'E4 · ' + fixedParams('e4', ['workload']), xName: 'workload', groups: workloadGroups },
          { type: 'bar', exp: 'e4', metric: lat, title: 'E4 · {LAT} by workload', subtitle: 'E4 · ' + fixedParams('e4', ['workload']), xName: 'workload', groups: workloadGroups },
          { type: 'line', exp: 'e5', expLabel: 'E5', x: 'rtt_ms', metric: 'tps', title: 'E5 · Throughput vs RTT' },
          { type: 'line', exp: 'e5', expLabel: 'E5', x: 'rtt_ms', metric: lat, title: 'E5 · {LAT} vs RTT' },
        ] },
      { id: 'rq3', label: 'RQ3 Faults', backends: ALL,
        intro: 'Each fault scenario of E6 (fault injected 60 s into the measurement): throughput and write latency, the write rate kept after the fault, wrong values served by a corrupt replica, and the recovery / detection summary. ' +
          Object.keys(FAULT_TEXT).map((k) => k + ' ' + FAULT_TEXT[k]).join(' · ') + '.',
        charts: [{ type: 'ratio' }].concat([4, 7].map((n) => ({ type: 'bar', exp: 'e6', metric: 'tps', twoLineX: true, xName: 'fault',
          title: 'E6 · Throughput by fault scenario, N=' + n,
          subtitle: 'E6 · N=' + n + ' · ' + fixedParams('e6', ['n']) + ' · whiskers: ± sample std',
          note: '"none (E2)" is the no-fault reference: E2 at the same N and client count. A node list in brackets marks scenarios that a backend ran on different nodes (node1 is the Raft bootstrap node; Kafka has no leader among the replicas). Throughput counts reads too, which keep succeeding locally after consensus stops; see the write ratio. Pale bars: host CPU saturated or MEM=1g.',
          groups: () => faultGroups(n) }))).concat([4, 7].map((n) => ({ type: 'bar', exp: 'e6', metric: 'LAT99', twoLineX: true, xName: 'fault',
          title: 'E6 · {LAT99} by fault scenario, N=' + n,
          subtitle: 'E6 · N=' + n + ' · ' + fixedParams('e6', ['n']) + ' · whiskers: ± sample std',
          groups: () => faultGroups(n) }))).concat([{ type: 'wrong' }, { type: 'rq3' }]) },
      { id: 'scope', label: 'Scope & baseline', backends: [] },
    ];
  }

  const tabsEl = document.getElementById('tabs');
  const panelsEl = document.getElementById('panels');
  const filtersEl = document.getElementById('filters');
  const datasetsEl = document.getElementById('datasets');
  let TABS = [];
  let views = {};
  let active = null;

  function buildAll() {
    TABS = defineTabs();
    tabsEl.replaceChildren();
    panelsEl.replaceChildren();
    views = {};
    TABS.forEach((tab) => {
      const btn = h('button', { type: 'button', role: 'tab', id: 'tab-' + tab.id, 'aria-controls': 'panel-' + tab.id, 'aria-selected': 'false', tabindex: '-1', text: tab.label });
      btn.addEventListener('click', () => select(tab.id, true));
      tabsEl.appendChild(btn);
      let view;
      if (tab.id === 'overview') view = overviewPanel();
      else if (tab.id === 'scope') view = scopePanel();
      else {
        const panel = h('div', { class: 'panel' }, [dsCard(false), h('p', { class: 'intro', text: tab.intro })]);
        const grid = h('div', { class: 'grid' });
        panel.appendChild(grid);
        const charts = tab.charts.map((c) => {
          const card = c.type === 'line' ? lineCard(c, tab) : c.type === 'bar' ? barCard(c, tab) : c.type === 'kafkaops' ? kafkaOpsCard()
            : c.type === 'ratio' ? writeRatioCard(tab) : c.type === 'wrong' ? wrongGetsCard(tab) : rq3Card(tab);
          if (c.type === 'ratio') panel.insertBefore(card.el, grid); // wide tables span the page
          else (c.type === 'rq3' || c.type === 'wrong' ? panel : grid).appendChild(card.el);
          return card;
        });
        if (tab.charts.some((c) => c.metric === 'LAT' || c.metric === 'LAT99')) panel.appendChild(h('p', { class: 'note', text: latNote() }));
        view = { el: panel, charts: charts };
      }
      view.el.id = 'panel-' + tab.id;
      view.el.setAttribute('role', 'tabpanel');
      view.el.setAttribute('aria-labelledby', 'tab-' + tab.id);
      view.el.hidden = true;
      panelsEl.appendChild(view.el);
      views[tab.id] = view;
    });
  }
  function renderDatasets() {
    datasetsEl.replaceChildren();
    datasetsEl.hidden = DATASETS.length < 2;
    datasetsEl.appendChild(h('span', { class: 'label', text: 'Dataset' }));
    const seg = h('div', { class: 'seg' });
    DATASETS.forEach((d) => {
      const b = h('button', { type: 'button', 'aria-pressed': String(d === DS), 'data-dataset': d.id, text: d.label });
      b.addEventListener('click', () => {
        if (d === DS) return;
        DS = d;
        try { window.localStorage.setItem('veritas-dashboard-dataset', d.id); } catch (e) { /* ignore */ }
        renderDatasets();
        buildAll();
        select(active, false);
      });
      seg.appendChild(b);
    });
    datasetsEl.appendChild(seg);
  }
  tabsEl.addEventListener('keydown', (ev) => {
    const i = TABS.findIndex((t) => t.id === active);
    let j = null;
    if (ev.key === 'ArrowRight') j = (i + 1) % TABS.length;
    else if (ev.key === 'ArrowLeft') j = (i - 1 + TABS.length) % TABS.length;
    else if (ev.key === 'Home') j = 0;
    else if (ev.key === 'End') j = TABS.length - 1;
    if (j === null) return;
    ev.preventDefault();
    select(TABS[j].id, true);
    document.getElementById('tab-' + TABS[j].id).focus();
  });

  function renderFilters(tab) {
    filtersEl.replaceChildren();
    filtersEl.hidden = !tab.backends.length;
    if (!tab.backends.length) return;
    filtersEl.appendChild(h('span', { class: 'label', text: 'Backends' }));
    ALL.filter((id) => tab.backends.includes(id)).forEach((id) => {
      const b = h('button', { type: 'button', class: 'toggle', 'aria-pressed': String(enabled[id]), 'data-backend': id }, [key(id, 'bar'), BY_ID[id].name]);
      b.addEventListener('click', () => {
        enabled[id] = !enabled[id];
        b.setAttribute('aria-pressed', String(enabled[id]));
        renderCharts();
      });
      filtersEl.appendChild(b);
    });
  }
  let lastWidth = 0;
  function renderCharts() {
    hideTip();
    views[active].charts.forEach((c) => c.render());
    lastWidth = panelsEl.clientWidth;
  }
  function select(id, push) {
    if (!views[id]) id = 'overview';
    active = id;
    TABS.forEach((t) => {
      const on = t.id === id;
      const b = document.getElementById('tab-' + t.id);
      b.setAttribute('aria-selected', String(on));
      b.setAttribute('tabindex', on ? '0' : '-1');
      views[t.id].el.hidden = !on;
    });
    renderFilters(TABS.find((t) => t.id === id));
    renderCharts();
    if (push && location.hash !== '#' + id) {
      try { history.replaceState(null, '', '#' + id); } catch (e) { /* file:// may refuse; the tab still switches */ }
    }
  }
  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { if (panelsEl.clientWidth !== lastWidth) renderCharts(); }, 150);
  });
  window.addEventListener('hashchange', () => select(location.hash.slice(1), false));
  renderDatasets();
  buildAll();

  // Header: generation time and data source; Live demo link and fonts only when served by the demo.
  const gen = new Date(DATA.generated);
  const genText = Number.isNaN(gen.getTime()) ? String(DATA.generated) : gen.toISOString().slice(0, 16).replace('T', ' ') + ' UTC';
  document.getElementById('subtitle').textContent = 'Generated ' + genText + ' · ' + DATASETS.length + (DATASETS.length === 1 ? ' dataset' : ' datasets') + ' · data: ' + (DATA.source || '');
  if (SERVED) {
    document.getElementById('pages').hidden = false;
    const css = [['Sans', 400, 'Regular'], ['Sans', 600, 'SemiBold'], ['Sans', 700, 'Bold'], ['Mono', 400, 'Regular'], ['Mono', 600, 'SemiBold']]
      .map((f) => "@font-face{font-family:'IBM Plex " + f[0] + "';font-weight:" + f[1] + ";font-style:normal;font-display:swap;src:url('/fonts/IBMPlex" + f[0] + '-' + f[2] + ".woff2') format('woff2')}").join('');
    document.head.appendChild(h('style', { text: css }));
  }
  select(location.hash.slice(1), false);
})();
</script>
</body>
</html>
