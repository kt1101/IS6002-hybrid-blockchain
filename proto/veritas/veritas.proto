syntax = "proto3";
package controller;

option go_package = "proto/veritas";

service Node {
    rpc Get (GetRequest) returns (GetResponse);
    rpc Set (SetRequest) returns (SetResponse);
    rpc Verify(VerifyRequest) returns (VerifyResponse);
    rpc BatchSet (BatchSetRequest) returns (BatchSetResponse);
    // Phase 2: a read with a Merkle proof the client checks (RQ4).
    rpc GetVerified (GetVerifiedRequest) returns (GetVerifiedResponse);
    // Phase 3: the nodes this node evicted (in-protocol accountability).
    rpc Evicted (EvictedRequest) returns (EvictedResponse);
    // Phase 3: a client's evidence of a bad signed read; the node puts it
    // on its next block, every node checks it in the apply loop.
    rpc ReportEvidence (Evidence) returns (EvidenceAck);
}

message VerifyRequest {
    string key = 1;
}

message VerifyResponse {
    bytes root_digest = 1;
    repeated bytes side_nodes = 2;
    bytes non_membership_leaf_data = 3;
}

enum MessageType {
    Approve = 0;
    Abort = 1;
}

message SharedLog {
    int64 seq = 1;
    repeated SetRequest sets = 2;
}

message Block {
    repeated SharedLog txs = 1;
    MessageType type = 2;
    string signature = 3;
    // Phase 2 (--attest-every): root attestations of the proposing node,
    // carried by its next block (or by a block with no txs).
    repeated RootAttestation attestations = 4;
    // Phase 3: evidence (bad signed reads) reported to the proposing node.
    repeated Evidence evidence = 5;
}

// Phase 2: node node_id's Ed25519 signature on
// "veritas-attest" 0x00 height(8 bytes big-endian) root.
message RootAttestation {
    int64 height = 1;
    bytes root = 2;
    int32 node_id = 3;
    bytes sig = 4;
}

message GetRequest {
    string signature = 1;
    string key = 2;
}

message GetResponse {
    string value = 1;
}

message SetRequest {
    string signature = 1;
    string key = 2;
    string value = 3;
    int64 version = 4;
    // Phase 2 (--verify-sigs): the signing client's id ("client<k>") and its
    // Ed25519 signature on key 0x00 value 0x00 version(8 bytes big-endian).
    string client_id = 5;
    bytes sig = 6;
}

message SetResponse {
    string txid = 1;
}

message BatchSetRequest {
    string signature = 1;
    repeated SetRequest sets = 2;
}

message BatchSetResponse {
    // Empty.
}

// Phase 2: value, version, Merkle proof and root of one key, all taken at
// the same height (one hold of the executor lock).
message GetVerifiedRequest {
    string key = 1;
    // Phase 2 (B2): wait until the proof's height is certified (a quorum
    // of root attestations) and return the attestations.
    bool certified = 2;
    // Phase 3: sign the response (node_sig) so a wrong one is evidence.
    bool signed = 3;
}

message GetVerifiedResponse {
    string value = 1;
    int64 version = 2;
    int64 height = 3;
    bytes root_digest = 4;
    repeated bytes side_nodes = 5;
    bytes non_membership_leaf_data = 6;
    repeated RootAttestation attestations = 7;
    // Phase 3: this node's eviction epoch (bumped by every eviction); a
    // client that sees it change asks Evicted.
    int64 evicted_epoch = 8;
    // Phase 3 (signed = true): node node_id's Ed25519 signature on
    // "veritas-read" 0x00 key 0x00 value 0x00 version(8B BE) height(8B BE)
    // root sha256(side_nodes concatenated || non_membership_leaf_data).
    bytes node_sig = 9;
    int32 node_id = 10;
}

// Phase 3: a signed read response, as evidence.
message SignedRead {
    string key = 1;
    string value = 2;
    int64 version = 3;
    int64 height = 4;
    bytes root = 5;
    repeated bytes side_nodes = 6;
    bytes non_membership_leaf_data = 7;
    int32 node_id = 8;
    bytes sig = 9;
}

// Phase 3: evidence that node culprit served a wrong read at height.
message Evidence {
    int32 culprit = 1;
    int64 height = 2;
    SignedRead read = 3;
}

message EvidenceAck {
    // Empty.
}

message EvictedRequest {
    // Empty.
}

message EvictedResponse {
    int64 epoch = 1;
    repeated int32 nodes = 2;
}
