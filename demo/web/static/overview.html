* { box-sizing: border-box; }

  display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 14px;

details[open] summary { margin-bottom: 6px; }

<script>
'use strict';
(function () {
  const DATA = JSON.parse(document.getElementById('data').textContent);
  const SVGNS = document.getElementById('defs').namespaceURI;
  const SERVED = /^https?:$/.test(location.protocol);

  // Fixed identity per backend: colour (CSS var --<id>) and marker shape.
  const BACKENDS = [
    { id: 'kafka', name: 'Kafka', shape: 'circle' },
    { id: 'raft', name: 'Raft', shape: 'square' },
    { id: 'tendermint', name: 'Tendermint', shape: 'triangle' },
    { id: 'bft2', name: 'HotStuff (bft2)', shape: 'diamond' },
  ];
  const BY_ID = {};
  BACKENDS.forEach((b) => { BY_ID[b.id] = b; });
  const ALL = BACKENDS.map((b) => b.id);
  const enabled = {};
  ALL.forEach((id) => { enabled[id] = true; });

  const METRIC = {
    tps: { label: 'throughput (tx/s)', unit: 'tx/s' },
    lat_mean_ms: { label: 'mean latency, all ops (CSV) (ms)', unit: 'ms' },
  };
  const X_LABEL = {
    clients: (v) => v + ' clients', n: (v) => 'N = ' + v, block_size: (v) => 'block ' + v,
    rtt_ms: (v) => 'RTT ' + v + ' ms', workload: (v) => 'YCSB ' + String(v).toUpperCase(),
  };
  const X_TITLE = { clients: 'clients (log2 scale)', n: 'cluster size N', block_size: 'block size (tx, log10 scale)', rtt_ms: 'added RTT (ms)', workload: 'YCSB workload' };
  const FAULT_TEXT = {
    F1: 'crash', F2: 'silent (no votes)', F3: 'slow (200 ms delay)', F4: 'wrong state', 'F5-F2': 'f+1 silent (BFT only)', 'F5-F4': 'f+1 wrong state (BFT only)',
  };
  const LAT_NOTE = 'Latency here is lat_mean_ms from the experiment CSVs: the mean over all operations (reads and writes). ' +
    'The write-latency figures in results/figs use per-run sidecar files that are not included in the repository, so the numbers differ.';

  // ---------- small helpers ----------
  function h(tag, props, kids) {
    const e = document.createElement(tag);
    if (props) {
      Object.keys(props).forEach((k) => {
        if (k === 'text') e.textContent = props[k];
        else if (k === 'class') e.className = props[k];
        else e.setAttribute(k, props[k]);
      });
    }
    (kids || []).forEach((c) => { if (c) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return e;
  }
  function s(tag, attrs, parent) {
    const e = document.createElementNS(SVGNS, tag);
    Object.keys(attrs || {}).forEach((k) => {
      if (k === 'text') e.textContent = attrs[k];
      else e.setAttribute(k, attrs[k]);
    });
    if (parent) parent.appendChild(e);
    return e;
  }
  function fmt(v) {
    if (v === null || v === undefined || Number.isNaN(v)) return '–';
    if (v === 0) return '0';
    const a = Math.abs(v);
    const dp = a >= 100 ? 0 : a >= 10 ? 1 : 2;
    return v.toLocaleString('en-US', { minimumFractionDigits: dp, maximumFractionDigits: dp });
  }
  function fmtStat(st, unit) {
    const u = unit ? ' ' + unit : '';
    return st.std === null ? fmt(st.mean) + u : fmt(st.mean) + ' ± ' + fmt(st.std) + u;
  }
  function repsText(n) { return '(' + n + (n === 1 ? ' rep)' : ' reps)'); }
  function ratio(a, b) { return (a / b).toFixed(2) + '×'; }
  function pct(a, b) {
    const p = (a / b - 1) * 100;
    return (p >= 0 ? '+' : '−') + Math.abs(p).toFixed(0) + '%';
  }
  function mean(xs) { return xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : null; }
  function uniq(xs) { return Array.from(new Set(xs)); }
  function rowsOf(exp) { return DATA.experiments[exp] || []; }
  function find(exp, where) {
    return rowsOf(exp).find((r) => Object.keys(where).every((k) => r[k] === where[k]));
  }

  // Marker glyph centred on (cx, cy); r ~ visual radius.
  function glyph(shape, cx, cy, r, parent, cls) {
    let e;
    if (shape === 'circle') e = s('circle', { cx: cx, cy: cy, r: r }, parent);
    else if (shape === 'square') { const a = r * 0.9; e = s('rect', { x: cx - a, y: cy - a, width: 2 * a, height: 2 * a, rx: 1 }, parent); }
    else if (shape === 'triangle') { const a = r * 1.25; e = s('path', { d: 'M' + cx + ',' + (cy - a) + 'L' + (cx + a) + ',' + (cy + a * 0.8) + 'L' + (cx - a) + ',' + (cy + a * 0.8) + 'Z' }, parent); }
    else { const a = r * 1.3; e = s('path', { d: 'M' + cx + ',' + (cy - a) + 'L' + (cx + a) + ',' + cy + 'L' + cx + ',' + (cy + a) + 'L' + (cx - a) + ',' + cy + 'Z' }, parent); }
    if (cls) e.setAttribute('class', cls);
    return e;
  }
  // Inline key for legends/tables: a short line (lines) or a swatch (bars) plus the marker shape.
  function key(id, kind) {
    const b = BY_ID[id];
    const svg = s('svg', { width: kind === 'line' ? 26 : 14, height: 14, 'aria-hidden': 'true', class: 's-' + id });
    if (kind === 'line') s('path', { d: 'M1,7H25', class: 'line', style: 'fill:none;stroke:var(--c);stroke-width:2' }, svg);
    glyph(b.shape, kind === 'line' ? 13 : 7, 7, 4.5, svg, 'mark');
    return svg;
  }
  function legend(ids, kind) {
    return h('ul', { class: 'legend', 'aria-label': 'Legend' }, ids.map((id) => h('li', null, [key(id, kind), BY_ID[id].name])));
  }

  // ---------- scales ----------
  function niceStep(span, count) {
    const raw = span / count;
    const p = Math.pow(10, Math.floor(Math.log10(raw)));
    const m = raw / p;
    return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10) * p;
  }
  function linearY(maxV, y0, y1) {
    const step = niceStep(maxV > 0 ? maxV : 1, 4);
    const top = Math.max(step, Math.ceil((maxV > 0 ? maxV : 1) / step) * step);
    const ticks = [];
    for (let t = 0; t <= top + step / 2; t += step) ticks.push(t);
    return { f: (v) => y1 - (v / top) * (y1 - y0), ticks: ticks };
  }
  function logY(minV, maxV, y0, y1) {
    const cands = [];
    for (let k = -2; k <= 7; k++) [1, 2, 5].forEach((m) => cands.push(m * Math.pow(10, k)));
    const lo = cands.filter((c) => c <= minV).pop() || cands[0];
    const hi = cands.find((c) => c >= maxV) || cands[cands.length - 1];
    const L0 = Math.log10(lo), L1 = Math.log10(hi);
    return { f: (v) => y1 - ((Math.log10(Math.max(v, lo)) - L0) / (L1 - L0 || 1)) * (y1 - y0), ticks: cands.filter((c) => c >= lo && c <= hi) };
  }
  function tickText(v) { return v >= 10000 ? (v / 1000).toLocaleString('en-US') + 'K' : v.toLocaleString('en-US'); }

  // ---------- tooltip ----------
  const tip = document.getElementById('tip');
  function showTip(head, rows, x, y) {
    tip.replaceChildren(h('div', { class: 'head', text: head }));
    rows.forEach((r) => tip.appendChild(h('div', { class: 'row' }, [key(r.id, r.kind), h('span', { class: 'val', text: r.val }), h('span', { class: 'name', text: r.name })])));
    tip.hidden = false;
    const w = tip.offsetWidth, ht = tip.offsetHeight;
    let left = x + 14, top = y + 14;
    if (left + w > window.innerWidth - 8) left = Math.max(8, x - w - 14);
    if (top + ht > window.innerHeight - 8) top = Math.max(8, y - ht - 14);
    tip.style.left = left + 'px';
    tip.style.top = top + 'px';
  }
  function hideTip() { tip.hidden = true; }
  function tipRow(r, metric, kind) {
    return { id: r.backend, kind: kind, val: fmtStat(r[metric], METRIC[metric].unit) + ' ' + repsText(r.reps), name: BY_ID[r.backend].name };
  }

  // ---------- data table under each chart ----------
  function dataTable(rows, xKey, xLabel, metric) {
    const t = h('table');
    t.appendChild(h('thead', null, [h('tr', null, [
      h('th', { text: xLabel }), h('th', { text: 'backend' }),
      h('th', { class: 'num', text: METRIC[metric].label.replace(/ \((tx\/s|ms)\)$/, '') + ' mean' }),
      h('th', { class: 'num', text: 'std' }), h('th', { class: 'num', text: 'reps' })])]));
    const tb = h('tbody');
    rows.forEach((r) => tb.appendChild(h('tr', null, [
      h('td', { text: xKey(r) }), h('td', null, [h('span', { class: 'key' }, [key(r.backend, 'bar'), BY_ID[r.backend].name])]),
      h('td', { class: 'num', text: fmt(r[metric].mean) }), h('td', { class: 'num', text: fmt(r[metric].std) }),
      h('td', { class: 'num', text: String(r.reps) })])));
    t.appendChild(tb);
    return h('details', null, [h('summary', { text: 'Data table' }), h('div', { class: 'table-wrap' }, [t])]);
  }

  // ---------- line chart ----------
  function lineChart(box, spec, ids) {
    const W = Math.max(300, box.clientWidth), H = 270;
    const m = { l: 56, r: 18, t: 30, b: 44 };
    const rows = rowsOf(spec.exp).filter((r) => ids.includes(r.backend));
    const xs = uniq(rows.map((r) => r[spec.x])).sort((a, b) => a - b);
    const svg = s('svg', { width: W, height: H, viewBox: '0 0 ' + W + ' ' + H, role: 'group', 'aria-label': spec.title });
    if (!rows.length) { box.replaceChildren(h('p', { class: 'empty', text: 'No backend selected.' })); return; }
    const tx = spec.xScale === 'log2' ? Math.log2 : spec.xScale === 'log10' ? Math.log10 : (v) => v;
    const tmin = tx(xs[0]), tmax = tx(xs[xs.length - 1]);
    const pad = 18;
    const X = (v) => (tmax === tmin ? (m.l + W - m.r) / 2 : m.l + pad + ((tx(v) - tmin) / (tmax - tmin)) * (W - m.r - m.l - 2 * pad));
    const vals = rows.map((r) => r[spec.metric].mean);
    const y = spec.yScale === 'log' ? logY(Math.min.apply(null, vals), Math.max.apply(null, vals), m.t, H - m.b)
      : linearY(Math.max.apply(null, rows.map((r) => r[spec.metric].mean + (r[spec.metric].std || 0))), m.t, H - m.b);
    const ax = s('g', { class: 'axis' }, svg);
    y.ticks.forEach((t) => {
      s('line', { x1: m.l, x2: W - m.r, y1: y.f(t), y2: y.f(t), class: 'grid-line' }, ax);
      s('text', { x: m.l - 8, y: y.f(t) + 4, 'text-anchor': 'end', class: 'tick', text: tickText(t) }, ax);
    });
    s('line', { x1: m.l, x2: W - m.r, y1: H - m.b, y2: H - m.b }, ax);
    xs.forEach((v) => s('text', { x: X(v), y: H - m.b + 18, 'text-anchor': 'middle', class: 'tick', text: String(v) }, ax));
    s('text', { x: (m.l + W - m.r) / 2, y: H - 6, 'text-anchor': 'middle', class: 'axis-title', text: X_TITLE[spec.x] }, ax);
    s('text', { x: m.l - 48, y: 12, class: 'axis-title', text: METRIC[spec.metric].label + (spec.yScale === 'log' ? ', log scale' : '') }, ax);

    const cross = s('line', { y1: m.t, y2: H - m.b, class: 'crosshair', visibility: 'hidden' }, svg);
    const pts = []; // {x, el, row}
    ids.forEach((id) => {
      const sr = rows.filter((r) => r.backend === id).sort((a, b) => a[spec.x] - b[spec.x]);
      if (!sr.length) return;
      const g = s('g', { class: 'series s-' + id }, svg);
      s('path', { class: 'line', d: sr.map((r, i) => (i ? 'L' : 'M') + X(r[spec.x]).toFixed(1) + ',' + y.f(r[spec.metric].mean).toFixed(1)).join('') }, g);
      sr.forEach((r) => {
        const cx = X(r[spec.x]), cy = y.f(r[spec.metric].mean);
        const pg = s('g', { class: 'pt', tabindex: '0', role: 'img',
          'aria-label': BY_ID[id].name + ', ' + X_LABEL[spec.x](r[spec.x]) + ': ' + fmtStat(r[spec.metric], METRIC[spec.metric].unit) + ' ' + repsText(r.reps) }, g);
        glyph(BY_ID[id].shape, cx, cy, 5, pg, 'mark');
        pts.push({ x: r[spec.x], el: pg, row: r, cx: cx, cy: cy });
      });
    });
    function at(xv, clientX, clientY) {
      cross.setAttribute('x1', X(xv)); cross.setAttribute('x2', X(xv)); cross.setAttribute('visibility', 'visible');
      const here = pts.filter((p) => p.x === xv);
      pts.forEach((p) => p.el.classList.toggle('hot', p.x === xv));
      const sorted = here.map((p) => p.row).sort((a, b) => b[spec.metric].mean - a[spec.metric].mean);
      showTip(X_LABEL[spec.x](xv), sorted.map((r) => tipRow(r, spec.metric, 'line')), clientX, clientY);
    }
    function off() { cross.setAttribute('visibility', 'hidden'); pts.forEach((p) => p.el.classList.remove('hot')); hideTip(); }
    const hit = s('rect', { x: m.l, y: m.t, width: W - m.l - m.r, height: H - m.t - m.b, class: 'hit' }, svg);
    svg.insertBefore(hit, cross);
    svg.addEventListener('pointermove', (ev) => {
      const rect = svg.getBoundingClientRect();
      const px = (ev.clientX - rect.left) * (W / rect.width);
      let best = xs[0];
      xs.forEach((v) => { if (Math.abs(X(v) - px) < Math.abs(X(best) - px)) best = v; });
      at(best, ev.clientX, ev.clientY);
    });
    svg.addEventListener('pointerleave', off);
    pts.forEach((p) => {
      p.el.addEventListener('focus', () => { const r = p.el.getBoundingClientRect(); at(p.x, r.right, r.bottom); });
      p.el.addEventListener('blur', off);
    });
    box.replaceChildren(svg);
  }

  // ---------- grouped bar chart ----------
  // groups: [{label, sub, rows}] ; every group's rows hold at most one row per backend.
  function barChart(box, spec, ids, groups) {
    const W = Math.max(300, box.clientWidth), H = 290;
    const m = { l: 56, r: 12, t: 30, b: spec.twoLineX ? 52 : 44 };
    const present = ids.filter((id) => groups.some((g) => g.rows.some((r) => r.backend === id)));
    if (!present.length) { box.replaceChildren(h('p', { class: 'empty', text: 'No backend selected.' })); return; }
    const svg = s('svg', { width: W, height: H, viewBox: '0 0 ' + W + ' ' + H, role: 'group', 'aria-label': spec.title });
    const all = [];
    groups.forEach((g) => g.rows.forEach((r) => { if (present.includes(r.backend)) all.push(r); }));
    const y = linearY(Math.max.apply(null, all.map((r) => r[spec.metric].mean + (r[spec.metric].std || 0))), m.t, H - m.b);
    const ax = s('g', { class: 'axis' }, svg);
    y.ticks.forEach((t) => {
      s('line', { x1: m.l, x2: W - m.r, y1: y.f(t), y2: y.f(t), class: 'grid-line' }, ax);
      s('text', { x: m.l - 8, y: y.f(t) + 4, 'text-anchor': 'end', class: 'tick', text: tickText(t) }, ax);
    });
    s('text', { x: m.l - 48, y: 12, class: 'axis-title', text: METRIC[spec.metric].label }, ax);
    const band = (W - m.l - m.r) / groups.length;
    const gap = 2;
    const bw = Math.max(4, Math.min(24, (band * 0.8 - gap * (present.length - 1)) / present.length));
    const span = present.length * bw + (present.length - 1) * gap;
    const base = H - m.b;
    groups.forEach((g, gi) => {
      const cx = m.l + band * gi + band / 2;
      s('text', { x: cx, y: base + 18, 'text-anchor': 'middle', class: 'tick', text: g.label }, ax);
      if (g.sub) s('text', { x: cx, y: base + 32, 'text-anchor': 'middle', class: 'tick', text: g.sub.replace(/node/g, 'n') }, ax);
      present.forEach((id, bi) => {
        const r = g.rows.find((q) => q.backend === id);
        if (!r) return;
        const st = r[spec.metric];
        const x0 = cx - span / 2 + bi * (bw + gap);
        const top = Math.min(y.f(st.mean), base - 1.5);
        const rad = Math.min(4, bw / 2, base - top);
        const bg = s('g', { class: 'bar-g s-' + id, tabindex: '0', role: 'img',
          'aria-label': BY_ID[id].name + ', ' + g.label + (g.sub ? ' ' + g.sub : '') + ': ' + fmtStat(st, METRIC[spec.metric].unit) + ' ' + repsText(r.reps) }, svg);
        s('rect', { x: x0 - gap / 2, y: m.t, width: bw + gap, height: base - m.t, class: 'hit' }, bg);
        s('path', { class: 'bar', d: 'M' + x0 + ',' + base + 'V' + (top + rad) + 'Q' + x0 + ',' + top + ' ' + (x0 + rad) + ',' + top +
          'H' + (x0 + bw - rad) + 'Q' + (x0 + bw) + ',' + top + ' ' + (x0 + bw) + ',' + (top + rad) + 'V' + base + 'Z' }, bg);
        let capY = top;
        if (st.std !== null && st.std > 0) {
          const y1 = y.f(st.mean + st.std), y2 = Math.min(base, y.f(Math.max(0, st.mean - st.std)));
          const mx = x0 + bw / 2;
          s('path', { class: 'whisker', d: 'M' + mx + ',' + y1 + 'V' + y2 + 'M' + (mx - 3) + ',' + y1 + 'H' + (mx + 3) + 'M' + (mx - 3) + ',' + y2 + 'H' + (mx + 3) }, bg);
          capY = Math.min(capY, y1);
        }
        glyph(BY_ID[id].shape, x0 + bw / 2, capY - 8, 3.5, bg, 'mark');
        const show = (cxp, cyp) => showTip(g.label + (g.sub ? ' ' + g.sub : '') + (g.title ? ' · ' + g.title : ''), [tipRow(r, spec.metric, 'bar')], cxp, cyp);
        bg.addEventListener('pointermove', (ev) => show(ev.clientX, ev.clientY));
        bg.addEventListener('pointerleave', hideTip);
        bg.addEventListener('focus', () => { const b = bg.getBoundingClientRect(); show(b.right, b.top); });
        bg.addEventListener('blur', hideTip);
      });
    });
    s('line', { x1: m.l, x2: W - m.r, y1: base, y2: base, class: 'axis-base', stroke: 'var(--line-strong)' }, svg);
    box.replaceChildren(svg);
  }

  // ---------- chart cards ----------
  function fixedParams(exp, skip) {
    const rows = rowsOf(exp);
    const parts = [];
    const label = { n: (v) => 'N=' + v, clients: (v) => v + ' clients', block_size: (v) => 'block ' + v, workload: (v) => 'YCSB ' + String(v).toUpperCase(), rtt_ms: (v) => 'RTT ' + v + ' ms' };
    Object.keys(label).forEach((k) => {
      if (skip.includes(k)) return;
      const vs = uniq(rows.map((r) => r[k]));
      if (vs.length === 1) parts.push(label[k](vs[0]));
    });
    return parts.join(' · ');
  }
  function lineCard(spec, tab) {
    const box = h('div', { class: 'chart' });
    const card = h('section', { class: 'card' }, [
      h('h3', { text: spec.title }),
      h('p', { class: 'sub', text: spec.expLabel + ' · ' + fixedParams(spec.exp, [spec.x]) }),
    ]);
    const leg = h('div');
    const tbl = h('div');
    card.append(leg, box, tbl);
    return { el: card, render: () => {
      const ids = tab.backends.filter((id) => enabled[id]);
      leg.replaceChildren(ids.length > 1 ? legend(ids, 'line') : '');
      lineChart(box, spec, ids);
      const rows = rowsOf(spec.exp).filter((r) => ids.includes(r.backend))
        .sort((a, b) => a[spec.x] - b[spec.x] || ALL.indexOf(a.backend) - ALL.indexOf(b.backend));
      tbl.replaceChildren(rows.length ? dataTable(rows, (r) => String(r[spec.x]), spec.x, spec.metric) : '');
    } };
  }
  function barCard(spec, tab) {
    const box = h('div', { class: 'chart' });
    const card = h('section', { class: 'card' }, [h('h3', { text: spec.title }), h('p', { class: 'sub', text: spec.subtitle })]);
    const leg = h('div');
    const tbl = h('div');
    card.append(leg, box, tbl);
    if (spec.note) card.appendChild(h('p', { class: 'note', text: spec.note }));
    return { el: card, render: () => {
      const ids = tab.backends.filter((id) => enabled[id]);
      const groups = spec.groups();
      leg.replaceChildren(ids.length > 1 ? legend(ids.filter((id) => groups.some((g) => g.rows.some((r) => r.backend === id))), 'bar') : '');
      barChart(box, spec, ids, groups);
      const rows = [];
      groups.forEach((g) => ALL.forEach((id) => {
        const r = g.rows.find((q) => q.backend === id);
        if (r && ids.includes(id)) rows.push(Object.assign({ _x: g.label + (g.sub ? ' ' + g.sub : '') }, r));
      }));
      tbl.replaceChildren(rows.length ? dataTable(rows, (r) => r._x, spec.xName, spec.metric) : '');
    } };
  }

  // E4: one group per workload.
  function workloadGroups() {
    const rows = rowsOf('e4');
    return uniq(rows.map((r) => r.workload)).sort().map((w) => ({ label: X_LABEL.workload(w), rows: rows.filter((r) => r.workload === w) }));
  }
  // E6 at cluster size n: one group per fault scenario (node list shown only
  // where a backend ran several variants of a scenario, as in results/figs),
  // preceded by the no-fault reference (E6 "none" rows, else E2 at the same n).
  function faultScenario(f) { return String(f).split(':')[0]; }
  function faultNodes(f) { const p = String(f).split(':'); return p.length > 1 ? p[1].split('@')[0] : ''; }
  function faultGroups(n) {
    const rows = rowsOf('e6').filter((r) => r.n === n);
    const faulted = rows.filter((r) => r.fault !== 'none');
    const split = new Set();
    uniq(faulted.map((r) => faultScenario(r.fault))).forEach((sc) => {
      ALL.forEach((id) => { if (uniq(faulted.filter((r) => r.backend === id && faultScenario(r.fault) === sc).map((r) => r.fault)).length > 1) split.add(sc); });
    });
    const byLabel = new Map();
    faulted.forEach((r) => {
      const sc = faultScenario(r.fault);
      const label = sc, sub = split.has(sc) ? '(' + faultNodes(r.fault) + ')' : '';
      const k = label + ' ' + sub;
      if (!byLabel.has(k)) byLabel.set(k, { label: label, sub: sub, title: FAULT_TEXT[sc] || '', rows: [] });
      byLabel.get(k).rows.push(r);
    });
    const groups = Array.from(byLabel.values()).sort((a, b) => (a.label + ' ' + a.sub).localeCompare(b.label + ' ' + b.sub));
    let ref = rows.filter((r) => r.fault === 'none');
    let refLabel = 'none';
    if (!ref.length) {
      const c = uniq(faulted.map((r) => r.clients))[0];
      ref = rowsOf('e2').filter((r) => r.n === n && r.clients === c && r.fault === 'none');
      refLabel = 'none (E2)';
    }
    if (ref.length) groups.unshift({ label: refLabel, sub: '', title: 'no fault, reference', rows: ref });
    return groups;
  }

  // ---------- overview ----------
  function compare(a, b, exps) {
    // a, b backend ids; returns facts computed from the data.
    const out = {};
    const e1 = rowsOf(exps.e1);
    const cs = uniq(e1.filter((r) => r.backend === a).map((r) => r.clients)).filter((c) => e1.some((r) => r.backend === b && r.clients === c));
    const maxC = Math.max.apply(null, cs);
    out.maxC = maxC;
    out.e1a = find(exps.e1, { backend: a, clients: maxC });
    out.e1b = find(exps.e1, { backend: b, clients: maxC });
    const e2 = rowsOf('e2');
    const ns = uniq(e2.map((r) => r.n)).sort((x, y) => x - y);
    out.nLo = ns[0]; out.nHi = ns[ns.length - 1];
    out.e2 = {};
    [a, b].forEach((id) => { out.e2[id] = { lo: find('e2', { backend: id, n: out.nLo }), hi: find('e2', { backend: id, n: out.nHi }) }; });
    return out;
  }
  function cmpWord(x, more, less) { return x >= 1 ? more : less; }
  function rqCard(opts) {
    const card = h('section', { class: opts.wide ? 'card wide' : 'card' }, [h('h2', { text: opts.title }), h('p', { class: 'question', text: opts.question })]);
    if (opts.hero) card.appendChild(h('div', { class: 'hero' }, [h('span', { class: 'big', text: opts.hero.value }), h('span', { class: 'cap', text: opts.hero.caption })]));
    if (opts.body) card.appendChild(opts.body);
    if (opts.facts) card.appendChild(h('ul', { class: 'facts' }, opts.facts.map((f) => h('li', { text: f }))));
    card.appendChild(h('div', { class: 'go' }, [h('button', { type: 'button', text: 'Open ' + opts.tab + ' tab', 'data-goto': opts.tabId })]));
    return card;
  }
  function pairFacts(a, b, c, extra) {
    const A = BY_ID[a].name, B = BY_ID[b].name;
    const facts = [];
    if (c.e1a && c.e1b) {
      facts.push('E1, ' + c.maxC + ' clients: ' + fmt(c.e1a.tps.mean) + ' vs ' + fmt(c.e1b.tps.mean) + ' tx/s (' + A + ' vs ' + B + ').');
      facts.push('Mean latency, all ops, same point: ' + fmt(c.e1a.lat_mean_ms.mean) + ' vs ' + fmt(c.e1b.lat_mean_ms.mean) + ' ms.');
    }
    (extra || []).forEach((f) => facts.push(f));
    const ea = c.e2[a], eb = c.e2[b];
    if (ea.lo && ea.hi && eb.lo && eb.hi) {
      facts.push('E2, N=' + c.nHi + ': ' + fmt(ea.hi.tps.mean) + ' vs ' + fmt(eb.hi.tps.mean) + ' tx/s (' + ratio(ea.hi.tps.mean, eb.hi.tps.mean) + ').');
      facts.push('Throughput change from N=' + c.nLo + ' to N=' + c.nHi + ': ' + A + ' ' + pct(ea.hi.tps.mean, ea.lo.tps.mean) + ', ' + B + ' ' + pct(eb.hi.tps.mean, eb.lo.tps.mean) + '.');
    }
    return facts;
  }
  function statusAll(st, word) {
    // "recovered:3" -> every rep has `word`; "detected:2;invalid:1" -> not all.
    return typeof st === 'string' && st.split(';').every((p) => p.split(':')[0] === word);
  }
  function overviewPanel() {
    const panel = h('div', { class: 'panel' });
    // Peak E1 throughput per backend.
    const tiles = h('div', { class: 'tiles' });
    BACKENDS.forEach((b) => {
      const rs = rowsOf('e1').filter((r) => r.backend === b.id);
      if (!rs.length) return;
      const best = rs.reduce((x, y) => (y.tps.mean > x.tps.mean ? y : x));
      tiles.appendChild(h('div', { class: 'tile' }, [
        h('span', { class: 'label' }, [key(b.id, 'bar'), b.name]),
        h('span', { class: 'value', text: fmt(best.tps.mean) + ' tx/s' }),
        h('span', { class: 'detail', text: '± ' + fmt(best.tps.std) + ' ' + repsText(best.reps) + ' · at ' + best.clients + ' clients' }),
      ]));
    });
    panel.appendChild(h('section', { class: 'card' }, [h('h2', { text: 'Peak throughput in E1' }),
      h('p', { class: 'sub', text: 'Highest mean throughput per backend over the client counts of E1 (' + fixedParams('e1', ['clients']) + ').' }), tiles]));

    const cards = h('div', { class: 'cards3' });
    const c1 = compare('bft2', 'tendermint', { e1: 'e1' });
    if (c1.e1a && c1.e1b) {
      const r = c1.e1a.tps.mean / c1.e1b.tps.mean;
      cards.appendChild(rqCard({
        title: 'RQ1 · HotStuff vs Tendermint', tab: 'RQ1', tabId: 'rq1',
        question: 'How does a linear-complexity BFT protocol (HotStuff) change throughput, latency and scalability compared with Tendermint?',
        hero: { value: ratio(c1.e1a.tps.mean, c1.e1b.tps.mean), caption: 'HotStuff (bft2) throughput relative to Tendermint at ' + c1.maxC + ' clients (E1): ' + cmpWord(r, 'higher', 'lower') + '.' },
        facts: pairFacts('bft2', 'tendermint', c1),
      }));
    }
    const c2 = compare('raft', 'kafka', { e1: 'e1' });
    if (c2.e1a && c2.e1b) {
      const extra = [];
      const bfa = find('e1-bf100ms', { backend: 'raft', clients: c2.maxC }), bfb = find('e1-bf100ms', { backend: 'kafka', clients: c2.maxC });
      if (bfa && bfb) extra.push('E1 with 100 ms batch flush, ' + c2.maxC + ' clients: ' + fmt(bfa.tps.mean) + ' vs ' + fmt(bfb.tps.mean) + ' tx/s (' + ratio(bfa.tps.mean, bfb.tps.mean) + '); latency ' + fmt(bfa.lat_mean_ms.mean) + ' vs ' + fmt(bfb.lat_mean_ms.mean) + ' ms.');
      cards.appendChild(rqCard({
        title: 'RQ2 · Raft vs Kafka', tab: 'RQ2', tabId: 'rq2',
        question: 'How does Raft (leader-based CFT) compare with Kafka approve-all (pub-sub CFT), and does Raft avoid the O(N²) ACK cost of Veritas (Kafka)?',
        hero: { value: ratio(c2.e1a.tps.mean, c2.e1b.tps.mean), caption: 'Raft throughput relative to Kafka at ' + c2.maxC + ' clients (E1): ' + cmpWord(c2.e1a.tps.mean / c2.e1b.tps.mean, 'higher', 'lower') + '.' },
        facts: pairFacts('raft', 'kafka', c2, extra),
      }));
    }
    // RQ3: per-backend recovery / detection over the fault scenarios.
    const t = h('table');
    t.appendChild(h('thead', null, [h('tr', null, [h('th', { text: 'backend' }),
      h('th', { class: 'num', text: 'recovered' }), h('th', { class: 'num', text: 'recovery (s)' }),
      h('th', { class: 'num', text: 'detected' }), h('th', { class: 'num', text: 'detect (s)' })])]));
    const tb = h('tbody');
    let toZero = 0;
    BACKENDS.forEach((b) => {
      const rs = DATA.rq3.filter((r) => r.backend === b.id);
      if (!rs.length) return;
      const rec = rs.filter((r) => statusAll(r.recovery_status, 'recovered')).length;
      const det = rs.filter((r) => statusAll(r.detect_status, 'detected')).length;
      const mr = mean(rs.map((r) => r.recovery_s_mean).filter((v) => typeof v === 'number'));
      const md = mean(rs.map((r) => r.detect_s_mean).filter((v) => typeof v === 'number'));
      toZero += rs.filter((r) => r.min_after_fault_tps_mean === 0).length;
      tb.appendChild(h('tr', null, [h('td', null, [h('span', { class: 'key' }, [key(b.id, 'bar'), b.name])]),
        h('td', { class: 'num', text: rec + ' of ' + rs.length }), h('td', { class: 'num', text: fmt(mr) }),
        h('td', { class: 'num', text: det + ' of ' + rs.length }), h('td', { class: 'num', text: fmt(md) })]));
    });
    t.appendChild(tb);
    const allRec = DATA.rq3.map((r) => r.recovery_s_mean).filter((v) => typeof v === 'number');
    const allDet = DATA.rq3.map((r) => r.detect_s_mean).filter((v) => typeof v === 'number');
    const facts = [];
    if (allRec.length) facts.push('Mean time to recover over ' + allRec.length + ' recovered scenarios: ' + fmt(mean(allRec)) + ' s (range ' + fmt(Math.min.apply(null, allRec)) + '–' + fmt(Math.max.apply(null, allRec)) + ' s).');
    if (allDet.length) facts.push('Mean time for the auditor to detect divergence over ' + allDet.length + ' scenarios: ' + fmt(mean(allDet)) + ' s.');
    facts.push('Throughput fell to 0 tx/s in every repetition at some point after the fault in ' + toZero + ' of ' + DATA.rq3.length + ' scenarios.');
    facts.push('Recovered / detected count the scenarios whose every repetition recovered or was detected; times are means over the scenarios that have a value.');
    cards.appendChild(rqCard({
      title: 'RQ3 · Faults', tab: 'RQ3', tabId: 'rq3',
      question: 'With f faulty or Byzantine nodes, how much performance does each backend lose, and how quickly does the ledger layer (Sparse Merkle Tree and Verify) detect state divergence?',
      body: h('div', { class: 'table-wrap' }, [t]), facts: facts, wide: true,
    }));
    panel.appendChild(cards);
    panel.appendChild(h('p', { class: 'note', text: 'Every number on this page is computed in the browser from the embedded data (mean over repetitions; ± is the sample standard deviation). ' + LAT_NOTE }));
    panel.addEventListener('click', (ev) => {
      const b = ev.target.closest('button[data-goto]');
      if (b) select(b.getAttribute('data-goto'), true);

    return { el: panel, charts: [] };
  }

  // ---------- RQ3 table ----------

  // ---------- tabs ----------
  const lat = 'lat_mean_ms';
  const TABS = [
    { id: 'overview', label: 'Overview', backends: [] },
    { id: 'rq1', label: 'RQ1 HotStuff vs Tendermint', backends: ['tendermint', 'bft2'],

        { type: 'line', exp: 'e1', expLabel: 'E1', x: 'clients', metric: 'tps', xScale: 'log2', yScale: 'log', title: 'E1 · Throughput vs clients' },
        { type: 'line', exp: 'e1', expLabel: 'E1', x: 'clients', metric: lat, xScale: 'log2', title: 'E1 · Mean latency vs clients' },
        { type: 'line', exp: 'e2', expLabel: 'E2', x: 'n', metric: 'tps', title: 'E2 · Throughput vs cluster size' },
        { type: 'line', exp: 'e2', expLabel: 'E2', x: 'n', metric: lat, title: 'E2 · Mean latency vs cluster size' },
      ] },
    { id: 'rq2', label: 'RQ2 Raft vs Kafka', backends: ['kafka', 'raft'],
      intro: 'Raft (leader-based CFT) against Kafka approve-all (pub-sub CFT): E1 and E2 as in RQ1, plus E1 repeated with a 100 ms batch flush (default 1 s: a partial block is sent after this long).',
      charts: [
        { type: 'line', exp: 'e1', expLabel: 'E1', x: 'clients', metric: 'tps', xScale: 'log2', yScale: 'log', title: 'E1 · Throughput vs clients' },
        { type: 'line', exp: 'e1', expLabel: 'E1', x: 'clients', metric: lat, xScale: 'log2', title: 'E1 · Mean latency vs clients' },
        { type: 'line', exp: 'e2', expLabel: 'E2', x: 'n', metric: 'tps', title: 'E2 · Throughput vs cluster size' },
        { type: 'line', exp: 'e2', expLabel: 'E2', x: 'n', metric: lat, title: 'E2 · Mean latency vs cluster size' },
        { type: 'line', exp: 'e1-bf100ms', expLabel: 'E1, batch flush 100 ms', x: 'clients', metric: 'tps', xScale: 'log2', yScale: 'log', title: 'E1 (100 ms flush) · Throughput vs clients' },
        { type: 'line', exp: 'e1-bf100ms', expLabel: 'E1, batch flush 100 ms', x: 'clients', metric: lat, xScale: 'log2', title: 'E1 (100 ms flush) · Mean latency vs clients' },
      ] },
    { id: 'sens', label: 'Sensitivity', backends: ALL,
      intro: 'How each backend reacts to block size (E3), workload mix (E4) and added network round-trip time (E5).',
      charts: [
        { type: 'line', exp: 'e3', expLabel: 'E3', x: 'block_size', metric: 'tps', xScale: 'log10', title: 'E3 · Throughput vs block size' },
        { type: 'line', exp: 'e3', expLabel: 'E3', x: 'block_size', metric: lat, xScale: 'log10', title: 'E3 · Mean latency vs block size' },
        { type: 'bar', metric: 'tps', title: 'E4 · Throughput by workload', subtitle: 'E4 · ' + fixedParams('e4', ['workload']), xName: 'workload', groups: workloadGroups },
        { type: 'bar', metric: lat, title: 'E4 · Mean latency by workload', subtitle: 'E4 · ' + fixedParams('e4', ['workload']), xName: 'workload', groups: workloadGroups },
        { type: 'line', exp: 'e5', expLabel: 'E5', x: 'rtt_ms', metric: 'tps', title: 'E5 · Throughput vs RTT' },
        { type: 'line', exp: 'e5', expLabel: 'E5', x: 'rtt_ms', metric: lat, title: 'E5 · Mean latency vs RTT' },
      ] },
    { id: 'rq3', label: 'RQ3 Faults', backends: ALL,
      intro: 'Throughput under each fault scenario (E6, fault injected at 60 s), and how fast each backend recovered and the auditor detected divergence. ' +
        Object.keys(FAULT_TEXT).map((k) => k + ' ' + FAULT_TEXT[k]).join(' · ') + '.',
      charts: [4, 7].map((n) => ({ type: 'bar', metric: 'tps', twoLineX: true, xName: 'fault',
        title: 'E6 · Throughput by fault scenario, N=' + n,
        subtitle: 'E6 · N=' + n + ' · ' + fixedParams('e6', ['n']) + ' · whiskers: ± sample std',
        note: '"none (E2)" is the no-fault reference: E2 at the same N and client count. A node list in brackets marks scenarios that a backend ran on different nodes (node1 is the Kafka/Raft leader).',
        groups: () => faultGroups(n) })).concat([{ type: 'rq3' }]) },
  ];

  const tabsEl = document.getElementById('tabs');
  const panelsEl = document.getElementById('panels');
  const filtersEl = document.getElementById('filters');
  const views = {};
  let active = null;

  TABS.forEach((tab) => {
    const btn = h('button', { type: 'button', role: 'tab', id: 'tab-' + tab.id, 'aria-controls': 'panel-' + tab.id, 'aria-selected': 'false', tabindex: '-1', text: tab.label });
    btn.addEventListener('click', () => select(tab.id, true));
    tabsEl.appendChild(btn);
    let view;
    if (tab.id === 'overview') view = overviewPanel();
    else {
      const panel = h('div', { class: 'panel' }, [h('p', { class: 'intro', text: tab.intro })]);
      const grid = h('div', { class: 'grid' });
      panel.appendChild(grid);
      const charts = tab.charts.map((c) => {
        const card = c.type === 'line' ? lineCard(c, tab) : c.type === 'bar' ? barCard(c, tab) : rq3Card(tab);
        (c.type === 'rq3' ? panel : grid).appendChild(card.el); // the wide table spans the page
        return card;
      });
      if (tab.charts.some((c) => c.metric === lat)) panel.appendChild(h('p', { class: 'note', text: LAT_NOTE }));
      view = { el: panel, charts: charts };
    }
    view.el.id = 'panel-' + tab.id;
    view.el.setAttribute('role', 'tabpanel');
    view.el.setAttribute('aria-labelledby', 'tab-' + tab.id);
    view.el.hidden = true;
    panelsEl.appendChild(view.el);
    views[tab.id] = view;
  });
  tabsEl.addEventListener('keydown', (ev) => {
    const i = TABS.findIndex((t) => t.id === active);
    let j = null;
    if (ev.key === 'ArrowRight') j = (i + 1) % TABS.length;
    else if (ev.key === 'ArrowLeft') j = (i - 1 + TABS.length) % TABS.length;
    else if (ev.key === 'Home') j = 0;
    else if (ev.key === 'End') j = TABS.length - 1;
    if (j === null) return;
    ev.preventDefault();
    select(TABS[j].id, true);
    document.getElementById('tab-' + TABS[j].id).focus();
  });

  function renderFilters(tab) {
    filtersEl.replaceChildren();
    filtersEl.hidden = !tab.backends.length;
    if (!tab.backends.length) return;
    filtersEl.appendChild(h('span', { class: 'label', text: 'Backends' }));
    ALL.filter((id) => tab.backends.includes(id)).forEach((id) => {
      const b = h('button', { type: 'button', class: 'toggle', 'aria-pressed': String(enabled[id]), 'data-backend': id }, [key(id, 'bar'), BY_ID[id].name]);
      b.addEventListener('click', () => {
        enabled[id] = !enabled[id];
        b.setAttribute('aria-pressed', String(enabled[id]));
        renderCharts();
      });
      filtersEl.appendChild(b);
    });
  }
  let lastWidth = 0;
  function renderCharts() {
    hideTip();
    views[active].charts.forEach((c) => c.render());
    lastWidth = panelsEl.clientWidth;
  }
  function select(id, push) {
    if (!views[id]) id = 'overview';
    active = id;
    TABS.forEach((t) => {
      const on = t.id === id;
      const b = document.getElementById('tab-' + t.id);
      b.setAttribute('aria-selected', String(on));
      b.setAttribute('tabindex', on ? '0' : '-1');
      views[t.id].el.hidden = !on;
    });
    renderFilters(TABS.find((t) => t.id === id));
    renderCharts();
    if (push && location.hash !== '#' + id) {
      try { history.replaceState(null, '', '#' + id); } catch (e) { /* file:// may refuse; the tab still switches */ }
    }
  }
  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { if (panelsEl.clientWidth !== lastWidth) renderCharts(); }, 150);
  });
  window.addEventListener('hashchange', () => select(location.hash.slice(1), false));

  // Header: generation time and data source; Live demo link and fonts only when served by the demo.
  const gen = new Date(DATA.generated);
  const genText = Number.isNaN(gen.getTime()) ? String(DATA.generated) : gen.toISOString().slice(0, 16).replace('T', ' ') + ' UTC';
  document.getElementById('subtitle').textContent = 'Generated ' + genText + ' · data: ' + (DATA.source || 'results/final, results/figs/rq3_summary.csv');
  if (SERVED) {
    document.getElementById('pages').hidden = false;
    const css = [['Sans', 400, 'Regular'], ['Sans', 600, 'SemiBold'], ['Sans', 700, 'Bold'], ['Mono', 400, 'Regular'], ['Mono', 600, 'SemiBold']]
      .map((f) => "@font-face{font-family:'IBM Plex " + f[0] + "';font-weight:" + f[1] + ";font-style:normal;font-display:swap;src:url('/fonts/IBMPlex" + f[0] + '-' + f[2] + ".woff2') format('woff2')}").join('');
    document.head.appendChild(h('style', { text: css }));
  }
  select(location.hash.slice(1), false);
})();
</script>
</body>
</html>
